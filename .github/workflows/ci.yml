name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags, for release notes

      - name: Compliance check
        run: |
          bash scripts/compliance.sh --self-test
          bash scripts/compliance.sh

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm packages
        run: npm ci

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Generated TypeScript types are committed
        run: git diff --exit-code -- src/lib/types

      # Releases from main get version 0.1.<run number> so the updater sees each one as newer.
      - name: Set release version (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          node -e '
            const fs = require("fs"); const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p)); c.version = "0.1.${{ github.run_number }}";
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n"); console.log("version", c.version);'

      # Signed updater files need the signing key (repo secrets). Without it, the build still
      # runs, just without update files.
      - name: Build app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "No signing key secret: building without updater files."
            npm run tauri build
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: pix-windows
          path: |
            src-tauri/target/release/pix.exe
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          # Release notes: the title of every commit since the previous release.
          prev=$(git tag --list "build-*" --sort=-v:refname | head -1)
          range=${prev:+$prev..}HEAD
          { echo "## What's new"; echo; git log "$range" --no-merges --format="- %s"; } > notes.md
          cat notes.md
          setup=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          files=("$setup" src-tauri/target/release/pix.exe)
          # latest.json tells installed copies about this release (only when it's signed).
          if [ -f "$setup.sig" ]; then
            node -e '
              const fs = require("fs"); const path = require("path");
              const [setup, tag, repo] = process.argv.slice(1);
              const latest = {
                version: "0.1.${{ github.run_number }}",
                notes: fs.readFileSync("notes.md", "utf8").replace(/^## .*\n\n/, "").trim(),
                pub_date: new Date().toISOString(),
                platforms: { "windows-x86_64": {
                  signature: fs.readFileSync(setup + ".sig", "utf8").trim(),
                  url: `https://github.com/${repo}/releases/download/${tag}/${path.basename(setup)}`
                } }
              };
              fs.writeFileSync("latest.json", JSON.stringify(latest, null, 2));' "$setup" "$tag" "${{ github.repository }}"
            files+=("$setup.sig" latest.json)
          fi
          gh release create "$tag" \
            --title "Pix build ${{ github.run_number }}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            "${files[@]}"
